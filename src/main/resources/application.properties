server.port=8080
server.servlet.context-path=/smart-attendance
server.servlet.session.timeout=60m

# JSP views (JSP pages host the React apps)
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# MySQL + Hibernate
spring.datasource.url=jdbc:mysql://localhost:3306/smart_attendance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:__________}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Mail (set MAIL_USERNAME / MAIL_PASSWORD env vars; for Gmail use an App Password)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:__________@gmail.com}
spring.mail.password=${MAIL_PASSWORD:__________}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:__________@gmail.com}

# Company settings
app.timezone=Asia/Kolkata
app.shift.day.start=09:00
app.shift.night.start=21:00
# a shift is 9 hours on site (8 working hours + break)
app.reminder.minutes-before=0
app.reminder.late-after-minutes=15
